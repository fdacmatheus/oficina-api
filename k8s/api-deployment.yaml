# Deployment da aplicacao. O Service que expoe estes pods pertence ao
# repositorio oficina-infra-k8s, porque e ele quem provisiona o Network Load
# Balancer consumido pelo API Gateway. O acoplamento entre os dois se da apenas
# pelo label `app: oficina-api`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: IMAGEM_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-api-config
            # Credenciais do RDS, materializadas a partir do Secrets Manager
            # pelo repositorio de infraestrutura.
            - secretRef:
                name: oficina-db-credentials
            - secretRef:
                name: oficina-api-secrets
          # Impede que o trafego chegue antes da conexao com o banco estar de pe.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ['ALL']
---
# Garante que o rolling update e o Cluster Autoscaler nunca derrubem a ultima
# replica disponivel.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oficina-api
  namespace: oficina
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oficina-api
